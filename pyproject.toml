[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tools"
version = "0.4.2"
description = "Cross-project knowledge brain: vault, CLI, neural UI, secure cards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
  "argon2-cffi>=23",
  "PyYAML>=6",
  "pywebview>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
brain = "brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
