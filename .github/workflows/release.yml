name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build pkg without uploading a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-pkg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          V=$(python3 -c "import re; t=open('pyproject.toml').read(); print(re.search(r'version\\s*=\\s*\\\"([^\\\"]+)\\\"', t).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building BrainTools $V"

      - name: Test
        run: |
          python3 -m pip install -U pip
          python3 -m pip install -e ".[dev]"
          python3 -m pytest -q

      - name: Build installer
        run: |
          chmod +x scripts/macos/build-installer.sh packaging/macos/assemble-app.sh
          ./scripts/macos/build-installer.sh

      - name: Sign / notarize (optional)
        env:
          BRAIN_SIGN_IDENTITY: ${{ secrets.BRAIN_SIGN_IDENTITY }}
          BRAIN_INSTALLER_ID: ${{ secrets.BRAIN_INSTALLER_ID }}
          BRAIN_NOTARY_PROFILE: ${{ secrets.BRAIN_NOTARY_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x scripts/macos/sign-and-notarize.sh
          PKG=$(ls dist/macos/BrainTools-*-*.pkg | head -1)
          APP="dist/macos/stage/Applications/Brain.app"
          if [[ ! -d "$APP" ]]; then
            APP="/usr/local/lib/brain-tools/Brain.app"
          fi
          # Prefer staged app from this build
          if [[ -d "dist/macos/stage/Applications/Brain.app" ]]; then
            APP="dist/macos/stage/Applications/Brain.app"
          fi
          ./scripts/macos/sign-and-notarize.sh "$APP" "$PKG" || true
          # Prefer signed artifact if produced
          if ls dist/macos/BrainTools-*-signed.pkg >/dev/null 2>&1; then
            echo "SIGNED_PKG=$(ls dist/macos/BrainTools-*-signed.pkg | head -1)" >> "$GITHUB_ENV"
          else
            echo "SIGNED_PKG=$PKG" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrainTools-pkg
          path: |
            dist/macos/BrainTools-*.pkg

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="${SIGNED_PKG:-$(ls dist/macos/BrainTools-*-*.pkg | grep -v signed | head -1)}"
          if [[ -f "${SIGNED_PKG:-}" ]]; then PKG="$SIGNED_PKG"; fi
          NOTES=$(awk '/^## 0\./{if(found){exit} found=1} found{print}' CHANGELOG.md | head -80)
          gh release create "$TAG" \
            --title "Brain ${{ steps.ver.outputs.version }}" \
            --notes "$NOTES" \
            "$PKG" \
            || gh release upload "$TAG" "$PKG" --clobber
